name: Lua syntax and headless tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check syntax
        run: |
          LUAC=luac5.1
          command -v "$LUAC" >/dev/null 2>&1 || LUAC=luac
          "$LUAC" -p \
            SuperSwingTimer_Diag.lua \
            SuperSwingTimer_Glow.lua \
            SuperSwingTimer_Constants.lua \
            SuperSwingTimer_State.lua \
            SuperSwingTimer_Weaving.lua \
            SuperSwingTimer_Hooks.lua \
            SuperSwingTimer_UI.lua \
            SuperSwingTimer_ClassMods.lua \
            SuperSwingTimer_Config.lua \
            SuperSwingTimer.lua \
            SuperSwingTimer_SoD.lua \
            SuperSwingTimer_Forever.lua \
            SuperSwingTimer_Tests.lua \
            Media/SuperSwingTimer_Media.lua \
            run_tests.lua
      - name: Run headless tests
        run: |
          if command -v lua5.1 >/dev/null 2>&1; then
            lua5.1 run_tests.lua
          else
            lua run_tests.lua
          fi
